<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test RHFL(Render HTML For LLMs)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    
    .header {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      padding: 24px;
      color: white;
    }
    
    .header h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    
    .header p {
      opacity: 0.9;
      font-size: 16px;
    }
    
    .controls {
      padding: 24px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
    }
    
    .input-group {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    
    .input-group label {
      font-weight: 600;
      color: #374151;
      font-size: 14px;
    }
    
    .input-group input {
      flex: 1;
      min-width: 300px;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.2s ease;
    }
    
    .input-group input:focus {
      outline: none;
      border-color: #4facfe;
      box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
    }
    
    .start-button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      min-width: 100px;
    }
    
    .start-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
    }
    
    .start-button:active {
      transform: translateY(0);
    }
    
    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      padding: 24px;
    }
    
    .panel {
      display: flex;
      flex-direction: column;
    }
    
    .panel-header {
      font-size: 16px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .panel-header::before {
      content: '';
      width: 4px;
      height: 16px;
      border-radius: 2px;
    }
    
    .code-panel .panel-header::before {
      background: #10b981;
    }
    
    .preview-panel .panel-header::before {
      background: #3b82f6;
    }
    
    textarea#response {
      width: 100%;
      min-height: 300px;
      font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.6;
      padding: 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      background-color: #f8fafc;
      resize: vertical;
      transition: all 0.2s ease;
    }
    
    textarea#response:focus {
      outline: none;
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
    }
    
    #app {
      width: 100%;
      height: 400px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      background-color: #ffffff;
      overflow: auto;
    }
    
    @media (max-width: 768px) {
      .content {
        grid-template-columns: 1fr;
      }
      
      .input-group {
        flex-direction: column;
        align-items: stretch;
      }
      
      .input-group input {
        min-width: 100%;
      }
      
      body {
        padding: 12px;
      }
      
      .header {
        padding: 20px;
      }
      
      .header h1 {
        font-size: 24px;
      }
      
      .controls, .content {
        padding: 20px;
      }
    }
    
    /* Loading state */
    .loading .start-button {
      background: #94a3b8;
      cursor: not-allowed;
      transform: none;
    }
    
    .loading .start-button:hover {
      transform: none;
      box-shadow: none;
    }
    
    /* Empty state styling */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #94a3b8;
      font-size: 14px;
    }
    
    .empty-state::before {
      content: '📱';
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>RHFL - Render HTML For LLMs</h1>
      <p>Stream and render S-expressions in real-time with optimized tree structure</p>
    </div>
    
    <div class="controls">
      <div class="input-group">
        <label for="apiKey">API Key:</label>
        <input type="password" id="apiKey" placeholder="Enter your API key here...">
        <button class="start-button" id="startBtn">Start Generation</button>
      </div>
    </div>
    
    <div class="content">
      <div class="panel">
        <div class="panel-header code-panel">
          <span>S-Expression Output</span>
        </div>
        <textarea id="response" placeholder="Generated S-expressions will appear here..."></textarea>
      </div>
      
      <div class="panel">
        <div class="panel-header preview-panel">
          <span>Live Preview</span>
        </div>
        <div id="app">
          <div class="empty-state">
            Start generation to see the preview
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script type="module">
    import { sendCompletions } from './lib/rhfl.js';

    const startBtn = document.getElementById('startBtn');
    const apiKeyInput = document.getElementById('apiKey');
    
    startBtn.addEventListener('click', () => {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) {
        alert('Please enter your API key first');
        apiKeyInput.focus();
        return;
      }
      
      // Add loading state
      document.body.classList.add('loading');
      startBtn.textContent = 'Generating...';
      startBtn.disabled = true;
      
      sendCompletions().finally(() => {
        // Remove loading state
        document.body.classList.remove('loading');
        startBtn.textContent = 'Start Generation';
        startBtn.disabled = false;
      });
    });
    
    // Enter key support for API key input
    apiKeyInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        startBtn.click();
      }
    });
  </script>
</body>
